name: Refresh data
# Manual only for now. To make it monthly, add:  schedule: [{ cron: '0 6 2 * *' }]
on:
  workflow_dispatch:
    inputs:
      n:
        description: Number of most recent incidents (0 = all)
        default: '0'
permissions:
  contents: write
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/refresh.py
        env: { N_INCIDENTS: '${{ inputs.n }}' }
      - name: Commit if changed, then deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json web/public/incidents.json web/public/summaries
          git diff --cached --quiet || (git commit -m "Data refresh $(date -u +%Y-%m-%d)" && git push && gh workflow run deploy.yml --ref main)
        env: { GH_TOKEN: "${{ github.token }}" }
